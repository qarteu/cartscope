name: Verify Alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test, validate, and package the extension
        run: npm run check
      - name: Build the static demo
        run: npm run build:demo
      - name: Install Chrome for Testing and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test the installed extension in Chrome
        run: npm run test:browser
      - name: Upload verification evidence and release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartscope-alpha-verification-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/screenshots/
            artifacts/browser-results.json
            artifacts/ui-results.json
            artifacts/cartscope-alpha-0.1.0.zip
            site/
